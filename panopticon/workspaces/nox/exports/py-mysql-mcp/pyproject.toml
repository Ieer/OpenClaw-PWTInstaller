[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-mysql-mcp"
version = "0.1.0"
description = "A MCP Server for MySQL database access (query/execute/list/describe), Python port of ts-mysql-mcp"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "mysql", "model-context-protocol", "ai", "llm"]
dependencies = [
    "mcp>=1.2,<2",
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
py-mysql-mcp = "py_mysql_mcp.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
