schema_version: 1
items:
  - id: python.pil_import
    title: Python Pillow import check
    category: runtime
    owner_scope: nox
    risk_level: L1
    requires_review: false
    secret_policy: none
    timeout_seconds: 10
    cooldown_seconds: 3600
    max_attempts_per_day: 3
    dependencies:
      commands: [python3]
      files:
        - /mnt/usb/scripts/restore-python-pkgs.sh
    probe:
      command: python3 -c "import PIL; print('PIL import ok')"
    repair:
      command: /mnt/usb/scripts/restore-python-pkgs.sh
    postcheck:
      command: python3 -c "import PIL; print('PIL import ok')"
    success_criteria: PIL can be imported by python3.
    rollback_hint: Re-run the offline package installer from /mnt/usb/package3.11 or rebuild the nox container image.
    evidence_paths:
      - memory/heartbeat-state.json

  - id: rokid.plugin_bundle
    title: Rokid OpenClaw bridge bundle
    category: plugin
    owner_scope: nox
    risk_level: L2
    requires_review: false
    secret_policy: redact
    timeout_seconds: 20
    cooldown_seconds: 3600
    max_attempts_per_day: 2
    dependencies:
      files:
        - /mnt/usb/scripts/restore-rokid-plugin.sh
    probe:
      command: test -f /usr/local/lib/node_modules/openclaw/dist/extensions/rokid-openclaw-bridge/index.js || test -f /home/node/.openclaw/extensions/rokid-openclaw-bridge/dist/index.js || test -f /home/node/.openclaw/extensions/rokid-openclaw-bridge/index.js
    repair:
      command: /mnt/usb/scripts/restore-rokid-plugin.sh
    postcheck:
      command: test -f /usr/local/lib/node_modules/openclaw/dist/extensions/rokid-openclaw-bridge/index.js || test -f /home/node/.openclaw/extensions/rokid-openclaw-bridge/dist/index.js || test -f /home/node/.openclaw/extensions/rokid-openclaw-bridge/index.js
    success_criteria: A real JavaScript entrypoint exists; sourcemap files are not required.
    rollback_hint: Disable the Rokid extension or rebuild it from the known bridge repository before restarting nox.
    evidence_paths:
      - memory/infra.md
      - memory/heartbeat-state.json

  - id: bypy.token_connectivity
    title: ByPy token presence and connectivity restore
    category: token
    owner_scope: nox
    risk_level: L3
    requires_review: true
    secret_policy: review_only
    timeout_seconds: 30
    cooldown_seconds: 21600
    max_attempts_per_day: 1
    dependencies:
      files:
        - /mnt/usb/scripts/restore-bypy-token.sh
    probe:
      command: test -f "$HOME/.bypy/bypy.json" || test -f "$HOME/.bypy/json/accessToken.json"
    repair:
      command: /mnt/usb/scripts/restore-bypy-token.sh
    postcheck:
      command: test -f "$HOME/.bypy/bypy.json" || test -f "$HOME/.bypy/json/accessToken.json"
    success_criteria: ByPy token file exists; live cloud actions still require explicit task-level intent.
    rollback_hint: Re-authorize ByPy manually and store only redacted status in nox memory.
    evidence_paths:
      - memory/infra.md
      - memory/heartbeat-state.json

  - id: wjx.cli_config
    title: wjx-cli installation and local config
    category: external_api
    owner_scope: nox
    risk_level: L3
    requires_review: true
    secret_policy: review_only
    timeout_seconds: 30
    cooldown_seconds: 21600
    max_attempts_per_day: 1
    dependencies:
      commands: [node]
      files:
        - /mnt/usb/scripts/restore-wjx-cli.sh
    probe:
      command: command -v wjx >/dev/null 2>&1 && wjx --version >/dev/null 2>&1
    repair:
      command: /mnt/usb/scripts/restore-wjx-cli.sh
    postcheck:
      command: command -v wjx >/dev/null 2>&1 && wjx --version >/dev/null 2>&1
    success_criteria: wjx CLI is installed and reports a version; API key operations remain Review-required.
    rollback_hint: Reinstall wjx-cli from the saved package or request a fresh API key from the user.
    evidence_paths:
      - skills/wjx-cli-use/SKILL.md
      - memory/heartbeat-state.json

  - id: workspace.state_queue
    title: nox state queue and Review gates
    category: workspace
    owner_scope: nox
    risk_level: L0
    requires_review: false
    secret_policy: none
    timeout_seconds: 10
    cooldown_seconds: 0
    max_attempts_per_day: 0
    dependencies:
      files:
        - state
    probe:
      command: test -d state && find state -maxdepth 2 -type f | wc -l >/dev/null
    success_criteria: state directory is readable and can be scanned for pending gates.
    rollback_hint: Recreate state directory from workspace skeleton if missing.
    evidence_paths:
      - state

  - id: workspace.contract
    title: nox workspace contract probe
    category: workspace
    owner_scope: nox
    risk_level: L1
    requires_review: false
    secret_policy: none
    timeout_seconds: 30
    cooldown_seconds: 3600
    max_attempts_per_day: 3
    dependencies:
      commands: [python3]
    probe:
      command: python3 skills/self-heal/tools/check_workspace_contract.py
    success_criteria: Workspace required directories (artifacts, sources, state, memory) exist and are writable.
    rollback_hint: Recreate missing directories with mkdir -p.
    evidence_paths:
      - artifacts
      - sources
      - state
      - memory

  - id: mission_control.api_health
    title: Mission Control service health (expected absent in this environment)
    category: service
    owner_scope: nox
    risk_level: L0
    requires_review: false
    secret_policy: none
    timeout_seconds: 10
    cooldown_seconds: 0
    max_attempts_per_day: 0
    dependencies:
      commands: [curl]
    probe:
      command: 'if ss -tlnp 2>/dev/null | grep -q :18910; then curl -fsS --max-time 5 http://localhost:18910/health >/dev/null; else exit 0; fi'
    success_criteria: Mission Control is either healthy or not deployed (expected in this environment).
    rollback_hint: Mission Control is not deployed in this environment; no action needed.
    evidence_paths: []

  - id: agent.nox_endpoint
    title: nox Gateway and Bridge endpoints
    category: service
    owner_scope: nox
    risk_level: L0
    requires_review: false
    secret_policy: none
    timeout_seconds: 30
    cooldown_seconds: 0
    max_attempts_per_day: 0
    dependencies:
      commands: [bash]
    probe:
      command: bash skills/self-heal/tools/check_agent_endpoints.sh nox
    success_criteria: nox gateway and bridge TCP endpoints are reachable.
    rollback_hint: Restart nox only after endpoint failure is confirmed and L2 Review policy is satisfied.
    evidence_paths:
      - skills/self-heal/tools/check_agent_endpoints.sh

  - id: release.preflight_dry_run
    title: Release preflight - nox version and state check
    category: release
    owner_scope: nox
    risk_level: L0
    requires_review: false
    secret_policy: none
    timeout_seconds: 15
    cooldown_seconds: 0
    max_attempts_per_day: 0
    dependencies:
      commands: [openclaw]
    probe:
      command: 'openclaw --version >/dev/null 2>&1 && test -d .release-state 2>/dev/null || true'
    success_criteria: nox CLI reports a version; release state directory exists or is created as needed.
    rollback_hint: Do not run rollout or rollback from self-heal without a separate Review-approved release action.
    evidence_paths:
      - .release-state

  - id: release.rollback_readiness
    title: Release rollback metadata readiness
    category: release
    owner_scope: nox
    risk_level: L0
    requires_review: false
    secret_policy: none
    timeout_seconds: 10
    cooldown_seconds: 0
    max_attempts_per_day: 0
    dependencies:
      commands: [test]
    probe:
      command: test -f .release-state/last-rollout.json
    success_criteria: Last rollout metadata exists before rollback is considered.
    rollback_hint: Create .release-state/last-rollout.json with current version info if this is the first known deployment.
    evidence_paths:
      - .release-state/last-rollout.json
