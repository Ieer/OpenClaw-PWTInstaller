map $http_upgrade $tls_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 443 ssl;
  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  resolver 127.0.0.11 ipv6=off;
  client_max_body_size 50m;

  set $mission_control_ui_tls_upstream mission-control-ui:9090;
  set $mission_control_api_tls_upstream mission-control-api:9090;

  location = /lan-ca.crt {
    alias /etc/nginx/tls/ca.crt;
    default_type application/x-x509-ca-cert;
    add_header Cache-Control "no-store";
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://$mission_control_ui_tls_upstream;
  }

  location /chat/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $tls_connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://$mission_control_api_tls_upstream;
  }
}