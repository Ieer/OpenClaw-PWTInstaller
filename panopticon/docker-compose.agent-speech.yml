services:
  agent-speech:
    container_name: agent-speech
    build:
      context: ./tools
      dockerfile: Dockerfile.agent-speech
    image: agent-speech:local
    profiles: ["voice-ui", "personal-voice"]
    volumes:
      - type: bind
        source: ./env/agent-speech.json
        target: /run/agent-speech.json
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    cpus: 0.75
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      panopticon:
        aliases: ["personal-speech"]