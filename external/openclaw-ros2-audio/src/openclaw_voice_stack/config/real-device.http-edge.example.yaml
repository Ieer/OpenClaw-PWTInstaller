wake_node:
  ros__parameters:
    wake_topic: wakeup
    # First hardware bringup uses a manual wake trigger. Publish /wakeup=true
    # from another shell, then speak into the microphone.
    mode: manual
    # Yahboom uses a 2s wakeup debounce to reduce self-triggering.
    cooldown_ms: 2000
    energy_threshold: 1200.0
    # Leave empty to use the ALSA default device, or set with
    # OPENCLAW_AUDIO_INPUT_DEVICE / ROS parameter override.
    mic_device: ""
    energy_probe_seconds: 0.35
    sample_rate: 16000
    channels: 1

asr_node:
  ros__parameters:
    wake_topic: wakeup
    asr_topic: asr
    asr_engine: http
    language: zh-CN
    # Keep HTTP ASR payload at 16 kHz. Yahboom may capture at 48 kHz then
    # resample to 16 kHz; use an ALSA plug device if your mic requires 48 kHz.
    sample_rate: 16000
    channels: 1
    # Fixed-duration capture for phase 1. Move to Yahboom-style WebRTC VAD later.
    max_utterance_seconds: 6.0
    # Delay after wakeup to avoid recording wakeup cue / speaker echo.
    wakeup_record_delay_ms: 400
    mic_device: ""
    model_path: ""
    asr_http_url_env: OPENCLAW_ASR_HTTP_URL
    asr_http_token_env: OPENCLAW_ASR_HTTP_TOKEN

tts_node:
  ros__parameters:
    tts_request_topic: tts_request
    tts_topic: tts_topic
    tts_engine: edge
    voice: zh-CN-XiaoyiNeural
    output_device: ""
    speed: 165
    model_path: ""
    command: ""

mc_tts_feedback_node:
  ros__parameters:
    tts_request_topic: tts_request
    # In the helper container this resolves through the shared compose network
    # namespace with mission-control-voice-bridge.
    mc_api_url: http://mission-control-api:9090
    mc_auth_token_env: MC_AUTH_TOKEN
    feed_limit: 80
    poll_interval_seconds: 0.5

manual_turn_node:
  ros__parameters:
    wake_topic: wakeup
    asr_topic: asr
    text_response_topic: text_response
    tts_topic: tts_topic
    asr_text: "指挥 帮我建个任务给 health：检查今晚备份状态"
    text_response: "processing manual turn"
    tts_text: "manual turn speaking"
    publish_text_response: false
    delay_seconds: 0.35
    wait_for_subscriptions: true
    subscription_wait_seconds: 5.0