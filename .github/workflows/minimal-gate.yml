name: Minimal CI Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  multi-agent-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mission_control
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: mission_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mission_control -d mission_control_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MC_TEST_DATABASE_URL: postgresql+asyncpg://mission_control:test-only@localhost:5432/mission_control_test
      MC_DATABASE_URL: postgresql+asyncpg://mission_control:test-only@localhost:5432/mission_control_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependencies
        run: python -m pip install -r mission_control_api/requirements.txt
      - name: Initialize disposable database vector extension
        run: |
          python - <<'PY'
          import asyncio
          import os
          import sqlalchemy as sa
          from sqlalchemy.ext.asyncio import create_async_engine
          async def initialize():
              engine = create_async_engine(os.environ["MC_TEST_DATABASE_URL"])
              if engine.url.database != "mission_control_test":
                  raise RuntimeError("only the disposable test database may be initialized")
              async with engine.begin() as connection:
                  await connection.execute(sa.text("CREATE EXTENSION IF NOT EXISTS vector"))
              await engine.dispose()
          asyncio.run(initialize())
          PY
      - name: API and disposable database regression
        run: python -m unittest discover -s mission_control_api/tests
      - name: Additive migration roundtrip
        working-directory: mission_control_api
        run: |
          alembic upgrade head
          alembic downgrade 20260524_0013
          alembic upgrade head
      - name: Install optional orchestration dependencies
        run: python -m pip install -r panopticon/tools/requirements-orchestration.txt
      - name: Offline checkpoint and approval pilot
        run: python -m unittest discover -s panopticon/tools -p 'test_weekly_review_pilot.py'
      - name: Managed worker lease and draft boundaries
        run: python -W error -m unittest discover -s panopticon/tools -p 'test_managed_execution_worker.py'
      - name: Native knowledge client and metadata contract
        run: python -m unittest discover -s panopticon/global-skills/knowledge-eval/tests
      - name: Install ROS voice unit test runner
        run: python -m pip install pytest
      - name: ROS voice device routing and cancellable playback
        run: pytest -q external/openclaw-ros2-audio/tests
      - name: Voice bridge idempotency and device identity
        run: python -W error -m unittest panopticon.tools.test_voice_ros_event_bridge
      - name: Shared Agent UI speech adapter boundaries
        run: python -W error -m unittest discover -s panopticon/tools -p 'test_agent_speech.py'
      - name: LAN device pairing policy boundaries
        run: node --test panopticon/tools/test_auto_approve_control_ui_repairs.js
      - name: Install Mission Control UI test dependencies
        run: python -m pip install -r MissionControl/requirements.txt
      - name: Mission Control voice/chat UI regression
        run: python -m unittest discover -s MissionControl/tests

  minimal-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r panopticon/tools/requirements.txt

      - name: Release defaults drift check
        run: |
          python tools/sync_openclaw_release.py --check

      - name: Manifest validation
        run: |
          python panopticon/tools/validate_panopticon.py

      - name: Skills template validation
        run: |
          python panopticon/tools/validate_skills_template.py

      - name: Python basic checks (syntax compile)
        run: |
          python -m compileall mission_control_api/app mission_control_api/alembic panopticon/tools tools

      - name: Generated artifacts drift check
        run: |
          python panopticon/tools/generate_panopticon.py --prune
          test -f panopticon/env/mission-control.env.example
          test -f panopticon/env/mission-control-ui.env.example
          test -f panopticon/env/mission-control-gateway.env.example
          test -f panopticon/env/mission-control-voice-bridge.env.example
          git diff --exit-code -- panopticon/docker-compose.panopticon.yml panopticon/env/*.env.example

      - name: Compose configuration sanity check
        run: |
          for example in panopticon/env/*.env.example; do
            target="${example%.example}"
            if [ ! -f "$target" ]; then
              cp "$example" "$target"
            fi
          done

          docker compose -f panopticon/docker-compose.panopticon.yml config > /tmp/panopticon.compose.rendered.yml
          grep -q "mission-control-api" /tmp/panopticon.compose.rendered.yml
          grep -q "mission-control-gateway" /tmp/panopticon.compose.rendered.yml
          grep -q "mc-postgres" /tmp/panopticon.compose.rendered.yml
          grep -q "mc-redis" /tmp/panopticon.compose.rendered.yml
